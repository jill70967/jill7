<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>趙嘉怡 的個人數位名片</title>

    <!-- 引入 Font Awesome 專業 Icon 圖標庫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* 1. 全局樣式設定 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', -apple-system, BlinkMacSystemFont, sans-serif;
            /* 柔和粉橘漸層背景 */
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fef9d7 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* 2. 主名片卡片（微光玻璃擬態效果） */
        .card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 35px 25px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 15px 35px rgba(235, 100, 120, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.8);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        /* 懸停浮起動畫 */
        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 40px rgba(235, 100, 120, 0.3);
        }

        /* 3. 大頭貼區域與光暈外框 */
        .avatar-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 16px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ffffff;
            box-shadow: 0 8px 20px rgba(255, 111, 145, 0.35);
            transition: transform 0.3s ease;
        }

        .avatar-container:hover .avatar {
            transform: scale(1.06) rotate(3deg);
        }

        /* 4. 姓名與個人頭銜標籤 */
        .name {
            font-size: 1.85rem;
            color: #2c3e50;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .tagline {
            font-size: 0.88rem;
            color: #ff6b81;
            font-weight: 600;
            background: rgba(255, 107, 129, 0.1);
            display: inline-block;
            padding: 4px 14px;
            border-radius: 20px;
            margin-bottom: 18px;
        }

        /* 5. 簡介區塊 (Bio Box) */
        .bio-box {
            background: #fff6f8;
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 22px;
            text-align: left;
            font-size: 0.88rem;
            line-height: 1.6;
            color: #4a5568;
            border: 1px solid #ffe0e6;
        }

        .bio-item {
            margin-bottom: 8px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .bio-item:last-child {
            margin-bottom: 0;
        }

        .bio-item i {
            color: #ff6b81;
            margin-top: 3px;
        }

        /* 區塊小標題 */
        .section-title {
            font-size: 0.82rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 12px;
            font-weight: 600;
        }

        /* 6. 按鈕區域 (雙欄網格) */
        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 22px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 10px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.88rem;
            transition: all 0.25s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        /* IG 專屬品牌漸層色 */
        .btn-instagram {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            color: white;
        }

        /* Email 按鈕色彩 */
        .btn-email {
            background: #3b82f6;
            color: white;
        }

        /* LinkedIn 按鈕色彩（設定滿版跨欄，維持整體對稱美感） */
        .btn-linkedin {
            background: #0077b5;
            color: white;
            grid-column: span 2;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
            filter: brightness(1.05);
        }

        /* 7. 頁腳 */
        .footer {
            margin-top: 22px;
            font-size: 0.75rem;
            color: #a0aec0;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- 1. 圓形大頭貼與動態旋轉效果 -->
        <div class="avatar-container">
            <img src="https://i.postimg.cc/bYkjH2Vv/2e043d56d0c48adaefce754a373d664a-0.jpg" alt="趙嘉怡的大頭貼" class="avatar">
        </div>
        
        <!-- 2. 姓名與個人頭銜 -->
        <h1 class="name">趙嘉怡</h1>
        <div class="tagline">✨ jill</div>
        
        <!-- 3. 詳細自我介紹卡 -->
        <div class="bio-box">
            <div class="bio-item">
                <i class="fa-solid fa-graduation-cap"></i>
                <span>休閒觀光管理系 | 樹德科技大學</span>
            </div>
            <div class="bio-item">
                <i class="fa-solid fa-palette"></i>
                <span>興趣：看電影、烹飪、攝影</span>
            </div>
        </div>
        
        <!-- 4. 聯絡與社群連結 -->
        <div class="section-title">Contact & Follow</div>
        <div class="button-grid">
            <a href="https://instagram.com/jllgllrd" target="_blank" class="btn btn-instagram">
                <i class="fa-brands fa-instagram"></i> Instagram
            </a>
            
            <a href="mailto:s26110171@stu.edu.tw" class="btn btn-email">
                <i class="fa-solid fa-envelope"></i> Email
            </a>

            <a href="https://www.linkedin.com/in/jilliane-gallardo-3547a03a7?utm_source=share_via&utm_content=profile&utm_medium=member_android" target="_blank" class="btn btn-linkedin">
                <i class="fa-brands fa-linkedin"></i> LinkedIn
            </a>
        </div>

        <!-- 5. 頁腳版權宣告 -->
        <div class="footer">
            © 2026 趙嘉怡 . All Rights Reserved
        </div>
    </div>

</body>
</html>
