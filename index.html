<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jill 的作品集入口網站</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', -apple-system, sans-serif;
            /* 柔和粉橘漸層背景 */
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fef9d7 100%);
            background-attachment: fixed;
            color: #2c3e50;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
            position: relative;
            overflow-x: hidden;
        }

        /* 浮動光暈微粒 */
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            pointer-events: none;
            animation: orbFloat 10s infinite alternate ease-in-out;
        }

        .orb-1 {
            width: 300px;
            height: 300px;
            background: rgba(255, 107, 129, 0.35);
            top: -40px;
            left: -40px;
        }

        .orb-2 {
            width: 350px;
            height: 350px;
            background: rgba(254, 207, 239, 0.6);
            bottom: -50px;
            right: -40px;
            animation-delay: -4s;
        }

        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 40px) scale(1.1); }
        }

        /* 主要容器 (毛玻璃擬態) */
        .container {
            max-width: 950px;
            width: 100%;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(16px);
            border-radius: 32px;
            padding: 2.5rem 2rem;
            box-shadow: 0 20px 40px rgba(235, 100, 120, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.9);
            text-align: center;
            position: relative;
            z-index: 1;
        }

        /* 1. 個人資料區塊 */
        .profile {
            margin-bottom: 2rem;
            position: relative;
        }

        .avatar-wrapper {
            position: relative;
            display: inline-block;
            cursor: pointer;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ffffff;
            box-shadow: 0 8px 25px rgba(255, 107, 129, 0.35);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .avatar-wrapper:hover .avatar {
            transform: scale(1.08) rotate(4deg);
        }

        .avatar-badge {
            position: absolute;
            bottom: 6px;
            right: 6px;
            background: #ff6b81;
            color: white;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            border: 2px solid white;
            box-shadow: 0 3px 8px rgba(0,0,0,0.15);
        }

        .name {
            font-size: 2rem;
            font-weight: 800;
            color: #2c3e50;
            margin-top: 0.8rem;
            letter-spacing: 1px;
        }

        .tagline {
            font-size: 0.92rem;
            color: #ff6b81;
            font-weight: 600;
            margin-top: 0.2rem;
        }

        /* 解鎖進度條 */
        .progress-container {
            max-width: 450px;
            margin: 1.2rem auto 2rem;
            background: rgba(255, 240, 243, 0.8);
            border: 1px solid #ffe0e6;
            padding: 12px 18px;
            border-radius: 20px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 700;
            color: #555;
            margin-bottom: 6px;
        }

        .progress-bar-bg {
            height: 10px;
            background: #f1f5f9;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 25%; /* 4/16 = 25% */
            background: linear-gradient(90deg, #ff6b81, #ff8e53);
            border-radius: 10px;
            transition: width 1s ease-in-out;
        }

        /* 篩選按鈕列 */
        .filter-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 1.8rem;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: #ffffff;
            border: 1px solid #ffe0e6;
            color: #64748b;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }

        .tab-btn.active, .tab-btn:hover {
            background: #ff6b81;
            color: #ffffff;
            border-color: #ff6b81;
            box-shadow: 0 4px 12px rgba(255, 107, 129, 0.3);
        }

        /* 網格區塊 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.25rem;
            width: 100%;
        }

        /* 通用卡片樣式 */
        .card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.3rem 1rem;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 700;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative;
            overflow: hidden;
            gap: 8px;
        }

        .card-icon {
            font-size: 1.5rem;
            margin-bottom: 2px;
        }

        /* 已解鎖卡片樣式 */
        .card.unlocked {
            background: #ffffff;
            color: #ff6b81;
            border: 1px solid #ffe0e6;
            box-shadow: 0 6px 16px rgba(235, 100, 120, 0.12);
        }

        .card.unlocked .card-icon {
            color: #ff6b81;
        }

        /* 閃光光澤動態 */
        .card.unlocked::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.6),
                transparent
            );
            transition: left 0.6s ease;
        }

        .card.unlocked:hover {
            transform: translateY(-6px) scale(1.03);
            border-color: #ff6b81;
            background: linear-gradient(135deg, #ffffff 0%, #fff5f7 100%);
            box-shadow: 0 12px 25px rgba(255, 107, 129, 0.3);
        }

        .card.unlocked:hover::before {
            left: 100%;
        }

        /* 未解鎖灰色卡片 */
        .card.locked {
            background: rgba(241, 245, 249, 0.7);
            color: #94a3b8;
            border: 2px dashed #cbd5e1;
            cursor: pointer;
            user-select: none;
        }

        .card.locked .card-icon {
            color: #cbd5e1;
        }

        .card.locked:hover {
            animation: shake 0.4s ease-in-out;
            background: rgba(255, 228, 232, 0.5);
            border-color: #ffb6c1;
            color: #ff6b81;
        }

        .card.locked:hover .card-icon {
            color: #ff6b81;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-4px); }
            40%, 80% { transform: translateX(4px); }
        }

        /* 飄浮愛心特效 */
        .floating-heart {
            position: fixed;
            pointer-events: none;
            color: #ff6b81;
            font-size: 1.2rem;
            animation: floatUp 1s ease-out forwards;
            z-index: 9999;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-60px) scale(1.4);
            }
        }

        /* Toast 提示訊息 */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(44, 62, 80, 0.92);
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            backdrop-filter: blur(8px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10000;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- 背景動態光暈 -->
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <div class="container">
        <!-- 1. 個人資料 -->
        <div class="profile">
            <div class="avatar-wrapper" id="avatarBtn">
                <img src="https://i.postimg.cc/7YTRm69x/abb1c899dff129a8efe0f9d75aae65c8.jpg" alt="jill的大頭貼" class="avatar">
                <div class="avatar-badge"><i class="fa-solid fa-sparkles"></i></div>
            </div>
            <h1 class="name">jill</h1>
            <p class="tagline">✨ 學習歷程與作業作品集 Portfolio Hub</p>
        </div>

        <!-- 2. 解鎖進度條 -->
        <div class="progress-container">
            <div class="progress-header">
                <span><i class="fa-solid fa-trophy" style="color:#ff6b81;"></i> 課程解鎖進度</span>
                <span id="progressText">4 / 16 (25%)</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
        </div>

        <!-- 3. 篩選分頁 Tab -->
        <div class="filter-tabs">
            <button class="tab-btn active" onclick="filterCards('all')">全部 (16)</button>
            <button class="tab-btn" onclick="filterCards('unlocked')">✨ 已解鎖 (4)</button>
            <button class="tab-btn" onclick="filterCards('locked')">🔒 未解鎖 (12)</button>
        </div>

        <!-- 4. 網格連結區塊 -->
        <div class="grid-container" id="gridContainer">
            <!-- 已解鎖項目 -->
            <a href="w1/index.html" class="card unlocked" data-status="unlocked">
                <i class="fa-solid fa-id-card card-icon"></i>
                <span>Week 1 - 數位名片</span>
            </a>
            <a href="w2/index.html" class="card unlocked" data-status="unlocked">
                <i class="fa-solid fa-utensils card-icon"></i>
                <span>Week 2 - 今天吃甚麼?</span>
            </a>
            <a href="w3/index.html" class="card unlocked" data-status="unlocked">
                <i class="fa-solid fa-face-laugh-squint card-icon"></i>
                <span>Week 3 - 迷因產生器</span>
            </a>
            <a href="w4/index.html" class="card unlocked" data-status="unlocked">
                <i class="fa-solid fa-comments card-icon"></i>
                <span>Week 4 - Knock Knock</span>
            </a>

            <!-- 未解鎖項目 -->
            <div class="card locked" data-status="locked" onclick="handleLockedClick(5)">
                <i class="fa-solid fa-lock card-icon"></i>
                <span>Week 5 - 未解鎖</span>
            </div>
            <div class="card locked" data-status="locked" onclick="handleLockedClick(6)">
                <i class="fa-solid fa-lock card-icon"></i>
                <span>Week 6 - 未解鎖</span>
            </div>
            <div class="card locked" data-status="locked" onclick="handleLockedClick(7)">
                <i class="fa-solid fa-lock card-icon"></i>
                <span>Week 7 - 未解鎖</span>
            </div>
            <div class="card locked" data-status="locked" onclick="handleLockedClick(8)">
                <i class="fa-solid fa-lock card-icon"></i>
                <span>Week 8 - 未解鎖</span>
            </div>
            <div class="card locked" data-status="locked" onclick="handleLockedClick(9)">
                <i class="fa-solid fa-lock card-icon"></i>
                <span>Week 9 - 未解鎖</span>
            </div>
            <div class="card locked" data-status="locked" onclick="handleLockedClick(10)">
                <i class="fa-solid fa-lock card-icon"></i>
                <span>Week 10 - 未解鎖</span>
            </div>
            <div class="card locked" data-status="locked" onclick="handleLockedClick(11)">
                <i class="fa-solid fa-lock card-icon"></i>
                <span>Week 11 - 未解鎖</span>
            </div>
            <div class="card locked" data-status="locked" onclick="handleLockedClick(12)">
                <i class="fa-solid fa-lock card-icon"></i>
                <span>Week 12 - 未解鎖</span>
            </div>
            <div class="card locked" data-status="locked" onclick="handleLockedClick(13)">
                <i class="fa-solid fa-lock card-icon"></i>
                <span>Week 13 - 未解鎖</span>
            </div>
            <div class="card locked" data-status="locked" onclick="handleLockedClick(14)">
                <i class="fa-solid fa-lock card-icon"></i>
                <span>Week 14 - 未解鎖</span>
            </div>
            <div class="card locked" data-status="locked" onclick="handleLockedClick(15)">
                <i class="fa-solid fa-lock card-icon"></i>
                <span>Week 15 - 未解鎖</span>
            </div>
            <div class="card locked" data-status="locked" onclick="handleLockedClick(16)">
                <i class="fa-solid fa-lock card-icon"></i>
                <span>Week 16 - 未解鎖</span>
            </div>
        </div>
    </div>

    <!-- Toast 提示區 -->
    <div class="toast" id="toast"><i class="fa-solid fa-circle-info"></i> <span id="toastMsg">此單元尚未開放！</span></div>

    <script>
        // 點擊大頭貼彩蛋：產生飄浮愛心
        const avatarBtn = document.getElementById('avatarBtn');
        avatarBtn.addEventListener('click', (e) => {
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    createHeart(e.clientX + (Math.random() * 40 - 20), e.clientY + (Math.random() * 40 - 20));
                }, i * 80);
            }
            showToast('✨ 感謝造訪 Jill 的作品集入口！');
        });

        function createHeart(x, y) {
            const heart = document.createElement('i');
            heart.className = 'fa-solid fa-heart floating-heart';
            heart.style.left = x + 'px';
            heart.style.top = y + 'px';
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 1000);
        }

        // 點擊未解鎖卡片提示
        function handleLockedClick(weekNum) {
            showToast(`🔒 Week ${weekNum} 尚未開放！敬請期待～ ✨`);
        }

        // Toast 顯示控制
        let toastTimeout;
        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            toastMsg.textContent = msg;

            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // 篩選卡片 (全部 / 已解鎖 / 未解鎖)
        function filterCards(type) {
            const cards = document.querySelectorAll('.card');
            const tabs = document.querySelectorAll('.tab-btn');

            // 切換按鈕狀態
            tabs.forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');

            cards.forEach(card => {
                const status = card.getAttribute('data-status');
                if (type === 'all' || status === type) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
