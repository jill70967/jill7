<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作品集入口網站</title>
    <style>
        /* 全域樣式設定 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', 'Segoe UI', sans-serif;
            /* 第一版的柔和粉紅漸層背景 */
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 55%, #ffdde1 100%);
            background-attachment: fixed;
            color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        /* 主要毛玻璃卡片容器 */
        .container {
            max-width: 900px;
            width: 100%;
            background: rgba(255, 255, 255, 0.90);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 2.5rem 2rem;
            box-shadow: 0 15px 35px rgba(235, 100, 120, 0.22);
            border: 1px solid rgba(255, 255, 255, 0.85);
            text-align: center;
        }

        /* 1. 個人資料區塊 */
        .profile {
            margin-bottom: 2.2rem;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ffffff;
            box-shadow: 0 8px 20px rgba(255, 111, 145, 0.35);
            margin-bottom: 0.9rem;
            transition: transform 0.3s ease;
        }

        .avatar:hover {
            transform: scale(1.06) rotate(3deg);
        }

        .name {
            font-size: 1.9rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: #2c3e50;
            margin-bottom: 0.4rem;
        }

        .tagline {
            font-size: 0.88rem;
            color: #ff6b81;
            font-weight: 600;
            background: rgba(255, 107, 129, 0.1);
            display: inline-block;
            padding: 4px 16px;
            border-radius: 20px;
        }

        /* 2. 16 個按鈕網格排列 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(185px, 1fr));
            gap: 1.15rem;
            width: 100%;
        }

        /* 通用卡片/按鈕樣式 */
        .card {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.25rem 1rem;
            border-radius: 18px;
            text-decoration: none;
            font-size: 0.96rem;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        /* 已解鎖按鈕樣式與 Hover 動畫 */
        .card.unlocked {
            background: #fff6f8;
            color: #ff6b81;
            border: 1.5px solid #ffe0e6;
            box-shadow: 0 4px 12px rgba(255, 107, 129, 0.1);
        }

        .card.unlocked::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.65),
                transparent
            );
            transition: left 0.5s ease;
        }

        .card.unlocked:hover {
            transform: translateY(-4px) scale(1.02);
            background: linear-gradient(135deg, #ff6b81, #ff8fa3);
            border-color: #ff6b81;
            color: #ffffff;
            box-shadow: 0 10px 20px rgba(255, 107, 129, 0.32);
        }

        .card.unlocked:hover::before {
            left: 100%;
        }

        /* 未解鎖柔粉灰狀態 */
        .card.locked {
            background-color: rgba(255, 255, 255, 0.55);
            color: #b89aa3;
            border: 1.5px dashed #f3c6d0;
            cursor: not-allowed;
            user-select: none;
        }

        .card.locked:hover {
            animation: shake 0.4s ease-in-out;
            background-color: #fff6f8;
        }

        /* 鎖定按鈕晃動動畫 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-4px); }
            40%, 80% { transform: translateX(4px); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 個人資料 -->
        <div class="profile">
            <img src="https://i.postimg.cc/7YTRm69x/abb1c899dff129a8efe0f9d75aae65c8.jpg" alt="jill的大頭貼" class="avatar">
            <h1 class="name">jill</h1>
            <div class="tagline">✨ 作品集入口網站 Portfolio</div>
        </div>

        <!-- 網格連結區塊 -->
        <div class="grid-container">
            <!-- 已解鎖項目 -->
            <a href="w1/index.html" class="card unlocked">Week 1 - 數位名片</a>
            <a href="w2/index.html" class="card unlocked">Week 2 - 今天吃甚麼?</a>
            <a href="w3/index.html" class="card unlocked">Week 3 - 迷因產生器</a>
            <a href="w4/index.html" class="card unlocked">Week 4 - Knock Knock</a>
            <a href="w5/index.html" class="card unlocked">Week 5 - TelepathyData</a>
          
            <!-- 未解鎖項目 -->
            <div class="card locked" aria-disabled="true">🔒 Week 6 - 未解鎖</div>
            <div class="card locked" aria-disabled="true">🔒 Week 7 - 未解鎖</div>
            <div class="card locked" aria-disabled="true">🔒 Week 8 - 未解鎖</div>
            <div class="card locked" aria-disabled="true">🔒 Week 9 - 未解鎖</div>
            <div class="card locked" aria-disabled="true">🔒 Week 10 - 未解鎖</div>
            <div class="card locked" aria-disabled="true">🔒 Week 11 - 未解鎖</div>
            <div class="card locked" aria-disabled="true">🔒 Week 12 - 未解鎖</div>
            <div class="card locked" aria-disabled="true">🔒 Week 13 - 未解鎖</div>
            <div class="card locked" aria-disabled="true">🔒 Week 14 - 未解鎖</div>
            <div class="card locked" aria-disabled="true">🔒 Week 15 - 未解鎖</div>
            <div class="card locked" aria-disabled="true">🔒 Week 16 - 未解鎖</div>
        </div>
    </div>

</body>
</html>
