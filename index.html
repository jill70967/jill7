
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作品集入口網站</title>
    <style>
        /* 全域樣式設定 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        /* 主要容器 */
        .container {
            max-width: 900px;
            width: 100%;
            text-align: center;
        }

        /* 1. 個人資料區塊（畫面正中央大頭貼與名字） */
        .profile {
            margin-bottom: 2.5rem;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #38bdf8;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
            margin-bottom: 1rem;
            transition: transform 0.3s ease;
        }

        .avatar:hover {
            transform: scale(1.05);
        }

        .name {
            font-size: 1.8rem;
            font-weight: bold;
            letter-spacing: 1px;
            color: #f3f4f6;
        }

        /* 2. 16 個按鈕網格排列（響應式，手機版也好看） */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1.25rem;
            width: 100%;
        }

        /* 通用卡片/按鈕樣式 */
        .card {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.25rem 1rem;
            border-radius: 12px;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        /* 已解鎖（前兩個）按鈕樣式與 5. 酷炫 Hover 動畫效果 */
        .card.unlocked {
            background: linear-gradient(135deg, #1e293b, #334155);
            color: #38bdf8;
            border: 1px solid #475569;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .card.unlocked::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(56, 189, 248, 0.2),
                transparent
            );
            transition: left 0.5s ease;
        }

        .card.unlocked:hover {
            transform: translateY(-5px) scale(1.02);
            border-color: #38bdf8;
            color: #ffffff;
            box-shadow: 0 10px 20px -5px rgba(56, 189, 248, 0.4);
        }

        .card.unlocked:hover::before {
            left: 100%;
        }

        /* 4. 未解鎖灰色狀態（鎖頭 Emoji） */
        .card.locked {
            background-color: #1e293b;
            color: #64748b;
            border: 1px dashed #334155;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .card.locked:hover {
            transform: shake;
            animation: shake 0.4s ease-in-out;
        }

        /* 鎖定按鈕的輕微晃動動畫 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-4px); }
            40%, 80% { transform: translateX(4px); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. 畫面正中央的大頭貼與名字 -->
        <div class="profile">
            <img src="Https://i.postimg.cc/7YTRm69x/abb1c899dff129a8efe0f9d75aae65c8.jpg" alt="大頭貼" class="avatar">
            <h1 class="name">jill</h1>
        </div>

        <!-- 2. 16 個按鈕網格區塊 -->
        <div class="grid-container">
            <!-- 3. 前兩個已解鎖連結 -->
            <a href="w1/index.html" class="card unlocked">Week 1 - 數位名片</a>
            <a href="w2/index.html" class="card unlocked">Week 2 - 今天吃甚麼?</a>

            <!-- 4. 剩下的 14 個未解鎖灰色按鈕（加上鎖頭 🔒） -->
            <div class="card locked">🔒 Week 3 - 未解鎖</div>
            <div class="card locked">🔒 Week 4 - 未解鎖</div>
            <div class="card locked">🔒 Week 5 - 未解鎖</div>
            <div class="card locked">🔒 Week 6 - 未解鎖</div>
            <div class="card locked">🔒 Week 7 - 未解鎖</div>
            <div class="card locked">🔒 Week 8 - 未解鎖</div>
            <div class="card locked">🔒 Week 9 - 未解鎖</div>
            <div class="card locked">🔒 Week 10 - 未解鎖</div>
            <div class="card locked">🔒 Week 11 - 未解鎖</div>
            <div class="card locked">🔒 Week 12 - 未解鎖</div>
            <div class="card locked">🔒 Week 13 - 未解鎖</div>
            <div class="card locked">🔒 Week 14 - 未解鎖</div>
            <div class="card locked">🔒 Week 15 - 未解鎖</div>
            <div class="card locked">🔒 Week 16 - 未解鎖</div>
        </div>
    </div>

</body>
</html>
