<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作業三：迷因產生器</title>

  <!-- 1. 引入 Google Fonts (Anton 與 Noto Sans TC) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">

  <!-- 2. 引入 html2canvas 截圖下載函式庫 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    /* CSS 樣式與整體風格設定 */
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #6366f1;
      --accent-hover: #4f46e5;
      --text-color: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 2.2rem;
      background: linear-gradient(135deg, #a855f7, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    /* RWD 響應式網格佈局：手機預設單欄，桌機顯示兩欄 */
    .container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
      width: 100%;
      max-width: 1000px;
    }

    @media (min-width: 768px) {
      .container {
        grid-template-columns: 350px 1fr;
      }
    }

    /* 控制面板與預覽卡片外觀 */
    .panel, .preview-area {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-group label {
      font-size: 0.9rem;
      font-weight: 600;
      color: #cbd5e1;
    }

    /* 隱藏原生檔案選擇器，改用自訂按鈕 */
    input[type="file"] {
      display: none;
    }

    .file-upload-btn {
      display: block;
      text-align: center;
      padding: 12px;
      background: #334155;
      color: #fff;
      border-radius: 8px;
      cursor: pointer;
      border: 2px dashed #475569;
      transition: all 0.2s ease;
    }

    .file-upload-btn:hover {
      background: #475569;
      border-color: var(--accent-color);
    }

    /* 文字輸入框樣式 */
    input[type="text"] {
      padding: 10px 14px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent-color);
    }

    /* 滑桿樣式 */
    input[type="range"] {
      width: 100%;
      accent-color: var(--accent-color);
      cursor: pointer;
    }

    /* 下載按鈕 */
    .download-btn {
      margin-top: 10px;
      padding: 14px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
    }

    .download-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
    }

    /* 即時預覽區域 */
    .preview-area {
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      min-height: 320px;
    }

    /* 迷因圖片與文字容器 (截圖目標) */
    #meme-container {
      position: relative;
      max-width: 100%;
      display: inline-block;
      border-radius: 8px;
      overflow: hidden;
      background-color: #000;
    }

    /* 底圖 */
    #meme-image {
      display: block;
      max-width: 100%;
      max-height: 500px;
      object-fit: contain;
    }

    /* 迷因文字樣式：加上黑色粗邊框 (text-shadow) */
    .meme-text {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      text-align: center;
      color: white;
      font-family: 'Anton', 'Noto Sans TC', sans-serif;
      text-transform: uppercase;
      word-wrap: break-word;
      line-height: 1.2;
      user-select: none;
      /* 8 方向黑色粗陰影 */
      text-shadow: 
        3px 3px 0 #000, -3px -3px 0 #000, 
        3px -3px 0 #000, -3px 3px 0 #000,
        0px 3px 0 #000,  0px -3px 0 #000, 
        3px 0px 0 #000, -3px 0px 0 #000;
    }

    #text-top-display {
      top: 10px;
    }

    #text-bottom-display {
      bottom: 10px;
    }
  </style>
</head>
<body>

  <header>
    <h1>🔥 迷因產生器 Meme Generator</h1>
  </header>

  <main class="container">
    <!-- 左側/上方：控制面板 -->
    <section class="panel">
      <!-- 1. 本地圖片上傳 (避免 CORS 錯誤) -->
      <div class="form-group">
        <label>1. 上傳圖片底圖</label>
        <label for="image-input" class="file-upload-btn">📁 選擇電腦中的圖片</label>
        <input type="file" id="image-input" accept="image/*">
      </div>

      <!-- 2. 雙層文字輸入 -->
      <div class="form-group">
        <label for="text-top-input">2. 上方文字</label>
        <input type="text" id="text-top-input" placeholder="請輸入上方文字...">
      </div>

      <div class="form-group">
        <label for="text-bottom-input">3. 下方文字</label>
        <input type="text" id="text-bottom-input" placeholder="請輸入下方文字...">
      </div>

      <!-- 3. 滑桿參數控制 -->
      <div class="form-group">
        <label for="font-size-slider">字體大小: <span id="font-size-val">32</span>px</label>
        <input type="range" id="font-size-slider" min="16" max="72" value="32">
      </div>

      <div class="form-group">
        <label for="top-pos-slider">上方文字垂直位置</label>
        <input type="range" id="top-pos-slider" min="0" max="40" value="10">
      </div>

      <div class="form-group">
        <label for="bottom-pos-slider">下方文字垂直位置</label>
        <input type="range" id="bottom-pos-slider" min="0" max="40" value="10">
      </div>

      <!-- 4. 一鍵下載按鈕 -->
      <button class="download-btn" id="download-btn">🚀 一鍵下載迷因</button>
    </section>

    <!-- 右側/下方：即時預覽區 -->
    <section class="preview-area">
      <div id="meme-container">
        <!-- 已替換為你的圖片網址 -->
        <img id="meme-image" src="generate a meme" alt="Meme Preview">
        <!-- 圖層文字 -->
        <div id="text-top-display" class="meme-text"></div>
        <div id="text-bottom-display" class="meme-text"></div>
      </div>
    </section>
  </main>

  <script>
    // 獲取所有 DOM 元素
    const imageInput = document.getElementById('image-input');
    const memeImage = document.getElementById('meme-image');

    const textTopInput = document.getElementById('text-top-input');
    const textBottomInput = document.getElementById('text-bottom-input');
    const textTopDisplay = document.getElementById('text-top-display');
    const textBottomDisplay = document.getElementById('text-bottom-display');

    const fontSizeSlider = document.getElementById('font-size-slider');
    const fontSizeVal = document.getElementById('font-size-val');
    const topPosSlider = document.getElementById('top-pos-slider');
    const bottomPosSlider = document.getElementById('bottom-pos-slider');

    const downloadBtn = document.getElementById('download-btn');
    const memeContainer = document.getElementById('meme-container');

    // 1. 本地圖片上傳：使用 FileReader 讀取圖片，防止跨域 (CORS) 錯誤
    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          memeImage.src = event.target.result; // 將圖片轉成 Base64 並載入
        };
        reader.readAsDataURL(file);
      }
    });

    // 2. 文字即時同步顯示
    textTopInput.addEventListener('input', () => {
      textTopDisplay.textContent = textTopInput.value;
    });

    textBottomInput.addEventListener('input', () => {
      textBottomDisplay.textContent = textBottomInput.value;
    });

    // 3. 滑桿控制字體大小與垂直位置
    fontSizeSlider.addEventListener('input', () => {
      const size = fontSizeSlider.value + 'px';
      textTopDisplay.style.fontSize = size;
      textBottomDisplay.style.fontSize = size;
      fontSizeVal.textContent = fontSizeSlider.value;
    });

    topPosSlider.addEventListener('input', () => {
      textTopDisplay.style.top = topPosSlider.value + 'px';
    });

    bottomPosSlider.addEventListener('input', () => {
      textBottomDisplay.style.bottom = bottomPosSlider.value + 'px';
    });

    // 初始化預設字體大小
    textTopDisplay.style.fontSize = fontSizeSlider.value + 'px';
    textBottomDisplay.style.fontSize = fontSizeSlider.value + 'px';

    // 4. 一鍵下載：使用 html2canvas 將 DOM 轉為 PNG 檔案並自動觸發下載
    downloadBtn.addEventListener('click', () => {
      html2canvas(memeContainer, {
        useCORS: true,
        scale: 2 // 提高輸出解析度
      }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'my-meme.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    });
  </script>
</body>
</html>
