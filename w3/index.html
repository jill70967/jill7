<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作業三：迷因產生器</title>

  <!-- 1. Google Fonts & Font Awesome 圖標庫 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- 2. html2canvas 截圖下載函式庫 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'PingFang TC', 'Noto Sans TC', -apple-system, sans-serif;
      /* 柔和粉橘漸層背景 */
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fef9d7 100%);
      color: #2c3e50;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 2.2rem;
      color: #ff6b81;
      font-weight: 900;
      letter-spacing: 1px;
      text-shadow: 0 2px 10px rgba(255, 107, 129, 0.2);
    }

    /* 網格佈局 */
    .container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
      width: 100%;
      max-width: 1000px;
    }

    @media (min-width: 768px) {
      .container {
        grid-template-columns: 360px 1fr;
      }
    }

    /* 控制面板與預覽卡片 (玻璃擬態效果) */
    .panel, .preview-area {
      background: rgba(255, 255, 255, 0.90);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      padding: 28px;
      box-shadow: 0 15px 35px rgba(235, 100, 120, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    .panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-group label {
      font-size: 0.88rem;
      font-weight: 700;
      color: #4a5568;
    }

    /* 自訂檔案上傳按鈕 */
    input[type="file"] {
      display: none;
    }

    .file-upload-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-align: center;
      padding: 12px;
      background: #ffffff;
      color: #ff6b81;
      border-radius: 14px;
      cursor: pointer;
      border: 2px dashed #ffb6c1;
      font-weight: 700;
      font-size: 0.92rem;
      transition: all 0.25s ease;
    }

    .file-upload-btn:hover {
      background: #ffe4e8;
      border-color: #ff6b81;
      transform: translateY(-2px);
    }

    /* 文字輸入框 */
    input[type="text"] {
      padding: 12px 16px;
      background: #ffffff;
      border: 1px solid #ffe0e6;
      border-radius: 14px;
      color: #2c3e50;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.25s ease;
    }

    input[type="text"]:focus {
      border-color: #ff6b81;
      box-shadow: 0 0 0 3px rgba(255, 107, 129, 0.15);
    }

    /* 滑桿 */
    input[type="range"] {
      width: 100%;
      accent-color: #ff6b81;
      cursor: pointer;
    }

    /* 下載按鈕 */
    .download-btn {
      margin-top: 10px;
      padding: 15px;
      background: linear-gradient(135deg, #ff6b81 0%, #ff8e53 100%);
      color: white;
      border: none;
      border-radius: 16px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 8px 20px rgba(255, 107, 129, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .download-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 25px rgba(255, 107, 129, 0.45);
      filter: brightness(1.03);
    }

    .download-btn:active {
      transform: translateY(1px);
    }

    /* 即時預覽區域 */
    .preview-area {
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      min-height: 380px;
      position: relative;
    }

    #meme-container {
      position: relative;
      max-width: 100%;
      display: inline-block;
      border-radius: 18px;
      overflow: hidden;
      background-color: transparent;
      min-width: 280px;
      min-height: 280px;
    }

    #meme-image {
      display: none;
      max-width: 100%;
      max-height: 500px;
      object-fit: contain;
      border-radius: 12px;
    }

    /* 未上傳圖片時顯示的占位圖示區塊 */
    .upload-placeholder {
      width: 320px;
      height: 320px;
      max-width: 100%;
      border: 3px dashed #ffb6c1;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.6);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 12px;
      color: #ff6b81;
      cursor: pointer;
      transition: all 0.25s ease;
      padding: 20px;
      text-align: center;
    }

    .upload-placeholder:hover {
      background: rgba(255, 228, 232, 0.8);
      border-color: #ff6b81;
      transform: scale(1.02);
    }

    .upload-placeholder i {
      font-size: 3.5rem;
    }

    .upload-placeholder p {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .upload-placeholder span {
      font-size: 0.82rem;
      color: #888;
    }

    /* 迷因文字樣式 */
    .meme-text {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      text-align: center;
      color: white;
      font-family: 'Anton', 'Noto Sans TC', sans-serif;
      text-transform: uppercase;
      word-wrap: break-word;
      line-height: 1.2;
      user-select: none;
      text-shadow: 
        3px 3px 0 #000, -3px -3px 0 #000, 
        3px -3px 0 #000, -3px 3px 0 #000,
        0px 3px 0 #000,  0px -3px 0 #000, 
        3px 0px 0 #000, -3px 0px 0 #000;
    }

    #text-top-display {
      top: 10px;
    }

    #text-bottom-display {
      bottom: 10px;
    }
  </style>
</head>
<body>

  <header>
    <h1>🔥 迷因產生器 Meme Generator</h1>
  </header>

  <main class="container">
    <!-- 左側：控制面板 -->
    <section class="panel">
      <!-- 1. 圖片上傳 -->
      <div class="form-group">
        <label>1. 上傳圖片底圖</label>
        <label for="image-input" class="file-upload-btn">
          <i class="fa-solid fa-cloud-arrow-up"></i> 選擇電腦中的圖片
        </label>
        <input type="file" id="image-input" accept="image/*">
      </div>

      <!-- 2. 文字輸入 -->
      <div class="form-group">
        <label for="text-top-input">2. 上方文字</label>
        <input type="text" id="text-top-input" placeholder="請輸入上方文字...">
      </div>

      <div class="form-group">
        <label for="text-bottom-input">3. 下方文字</label>
        <input type="text" id="text-bottom-input" placeholder="請輸入下方文字...">
      </div>

      <!-- 3. 滑桿參數控制 -->
      <div class="form-group">
        <label for="font-size-slider">字體大小: <span id="font-size-val">32</span>px</label>
        <input type="range" id="font-size-slider" min="16" max="72" value="32">
      </div>

      <div class="form-group">
        <label for="top-pos-slider">上方文字垂直位置</label>
        <input type="range" id="top-pos-slider" min="0" max="40" value="10">
      </div>

      <div class="form-group">
        <label for="bottom-pos-slider">下方文字垂直位置</label>
        <input type="range" id="bottom-pos-slider" min="0" max="40" value="10">
      </div>

      <!-- 4. 下載按鈕 -->
      <button class="download-btn" id="download-btn">
        <i class="fa-solid fa-download"></i> 一鍵下載迷因
      </button>
    </section>

    <!-- 右側：即時預覽區 -->
    <section class="preview-area">
      <div id="meme-container">
        <!-- 上傳提示 Placeholder -->
        <div id="placeholder-box" class="upload-placeholder">
          <i class="fa-solid fa-image"></i>
          <p>請上傳您的圖片</p>
          <span>點擊此處或使用左側按鈕選擇照片</span>
        </div>

        <img id="meme-image" src="" alt="Meme Preview">
        <div id="text-top-display" class="meme-text"></div>
        <div id="text-bottom-display" class="meme-text"></div>
      </div>
    </section>
  </main>

  <script>
    const imageInput = document.getElementById('image-input');
    const memeImage = document.getElementById('meme-image');
    const placeholderBox = document.getElementById('placeholder-box');

    const textTopInput = document.getElementById('text-top-input');
    const textBottomInput = document.getElementById('text-bottom-input');
    const textTopDisplay = document.getElementById('text-top-display');
    const textBottomDisplay = document.getElementById('text-bottom-display');

    const fontSizeSlider = document.getElementById('font-size-slider');
    const fontSizeVal = document.getElementById('font-size-val');
    const topPosSlider = document.getElementById('top-pos-slider');
    const bottomPosSlider = document.getElementById('bottom-pos-slider');

    const downloadBtn = document.getElementById('download-btn');
    const memeContainer = document.getElementById('meme-container');

    // 點擊預覽區 Placeholder 亦可開啟檔案選擇器
    placeholderBox.addEventListener('click', () => {
      imageInput.click();
    });

    // 讀取上傳的本地圖片
    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          memeImage.src = event.target.result;
          memeImage.style.display = 'block';
          placeholderBox.style.display = 'none'; // 隱藏占位區塊
        };
        reader.readAsDataURL(file);
      }
    });

    // 文字即時同步
    textTopInput.addEventListener('input', () => {
      textTopDisplay.textContent = textTopInput.value;
    });

    textBottomInput.addEventListener('input', () => {
      textBottomDisplay.textContent = textBottomInput.value;
    });

    // 滑桿控制字體大小與位置
    fontSizeSlider.addEventListener('input', () => {
      const size = fontSizeSlider.value + 'px';
      textTopDisplay.style.fontSize = size;
      textBottomDisplay.style.fontSize = size;
      fontSizeVal.textContent = fontSizeSlider.value;
    });

    topPosSlider.addEventListener('input', () => {
      textTopDisplay.style.top = topPosSlider.value + 'px';
    });

    bottomPosSlider.addEventListener('input', () => {
      textBottomDisplay.style.bottom = bottomPosSlider.value + 'px';
    });

    textTopDisplay.style.fontSize = fontSizeSlider.value + 'px';
    textBottomDisplay.style.fontSize = fontSizeSlider.value + 'px';

    // 一鍵下載迷因
    downloadBtn.addEventListener('click', () => {
      if (!memeImage.src || memeImage.style.display === 'none') {
        alert('請先上傳圖片再進行下載！');
        return;
      }
      html2canvas(memeContainer, {
        useCORS: true,
        scale: 2
      }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'my-meme.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    });
  </script>
</body>
</html>
