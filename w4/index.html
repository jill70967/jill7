<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>朋友對我的動態留言板</title>

  <!-- 1. 引入 Google Fonts (Noto Sans TC) 與 Font Awesome 圖標庫 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* =========================================================
       🎨 1. 全局變數與風格設計 (柔和粉橘漸層玻璃擬態風格)
       ========================================================= */
    :root {
      /* 🌈【顏色設定區】若需要修改顏色，請在這裡調整 */
      --bg-gradient: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fef9d7 100%); /* 頁面背景漸層 */
      --card-bg: rgba(255, 255, 255, 0.88); /* 卡片半透明白底 */
      --card-border: rgba(255, 255, 255, 0.8); /* 卡片邊框 */
      --primary-color: #ff6b81; /* 主主題色 (粉紅) */
      --text-dark: #2c3e50; /* 主要文字顏色 */
      --text-muted: #718096; /* 次要文字/時間顏色 */
      
      /* 💡【亮起特效顏色設定】當卡片被選中時的發光邊框與陰影 */
      --highlight-border: #ff6b81;
      --highlight-shadow: rgba(255, 107, 129, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'PingFang TC', 'Noto Sans TC', -apple-system, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-dark);
      min-height: 100vh;
      padding: 30px 20px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 頁面標頭區域 */
    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 2.3rem;
      color: var(--primary-color);
      font-weight: 900;
      letter-spacing: 1px;
      margin-bottom: 8px;
      text-shadow: 0 2px 10px rgba(255, 107, 129, 0.2);
    }

    header p {
      font-size: 0.95rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* 主容器 */
    .container {
      width: 100%;
      max-width: 1100px;
      position: relative;
    }

    /* =========================================================
       ⏳ 2. 酷炫載入中動畫 (Cool Loading Animation)
       ========================================================= */
    #loading-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(235, 100, 120, 0.15);
      margin: 20px auto;
      max-width: 380px;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid rgba(255, 107, 129, 0.2);
      border-top-color: var(--primary-color);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #loading-screen p {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary-color);
      letter-spacing: 1px;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    /* =========================================================
       🏛️ 3. 瀑布流排版 (Masonry Layout via CSS column-count)
       ========================================================= */
    .masonry-grid {
      display: none; /* 資料載入完成後透過 JS 顯示 */
      column-count: 3; /* 桌機預設顯示 3 欄 */
      column-gap: 20px;
      width: 100%;
    }

    /* 響應式欄位控制 (RWD) */
    @media (max-width: 900px) {
      .masonry-grid {
        column-count: 2; /* 平板顯示 2 欄 */
      }
    }

    @media (max-width: 600px) {
      .masonry-grid {
        column-count: 1; /* 手機顯示 1 欄 */
      }
    }

    /* =========================================================
       ✨ 4. 留言卡片與輪播 Highlight 特效樣式
       ========================================================= */
    .message-card {
      break-inside: avoid; /* 關鍵：防止瀑布流將單張卡片從中間截斷 */
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
      position: relative;
      transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1); /* 平滑過渡動畫 */
      opacity: 0.55; /* 未選中的卡片微暗 */
      filter: blur(1px); /* 未選中的卡片微模糊 */
      transform: scale(0.97);
    }

    /* 🌟【高亮 Highlight 狀態】當卡片被輪播選中時 */
    .message-card.highlight {
      opacity: 1;
      filter: blur(0px);
      transform: scale(1.05); /* 放大 1.05 倍 */
      border: 2px solid var(--highlight-border); /* 加粗亮起邊框 */
      box-shadow: 0 15px 35px var(--highlight-shadow); /* 光彩發光陰影 */
      z-index: 10;
    }

    /* 卡片頭部：名字與時間 */
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px dashed rgba(255, 107, 129, 0.2);
    }

    .author-name {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--primary-color);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .timestamp {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* 留言本文內容 */
    .card-body {
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--text-dark);
      white-space: pre-wrap; /* 保持留言內容中的換行與空格 */
      word-break: break-word;
    }

    /* 卡片頁尾小圖示 */
    .card-footer {
      text-align: right;
      margin-top: 10px;
      font-size: 0.8rem;
      color: var(--primary-color);
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <header>
    <h1>💌 朋友對我的動態留言板</h1>
    <p>來自好朋友們的真摯祝福與真心話 ✨</p>
  </header>

  <main class="container">
    <!-- 讀取中動畫指示區 -->
    <div id="loading-screen">
      <div class="spinner"></div>
      <p>讀取留言中…</p>
    </div>

    <!-- 瀑布流留言卡片容器 -->
    <div id="masonry-container" class="masonry-grid"></div>
  </main>

  <script>
    /* =========================================================
       ⚙️ 核心設定參數區 (可依需求自由修改)
       ========================================================= */

    // 1. 🔗 Google 試算表 CSV 網址 (已串接您提供的發佈網址)
    const GOOGLE_SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQJsD1qv1LHbS5JaDSB4TUGKWGABGfJ_ASTzOpAE6TO2ysJ34e47sWGizGZJoDIFVZEQZj03cwjbahb/pub?output=csv';

    // 2. ⏱️【輪播秒數設定】切換高亮卡片的間隔時間（單位：毫秒，3000ms = 3 秒）
    const CAROUSEL_INTERVAL_MS = 3000;

    /* =========================================================
       程式邏輯執行區塊
       ========================================================= */

    let messageCards = []; // 存放畫面上所有留言卡片 DOM 的陣列
    let currentIndex = 0;   // 當前 Highlight 輪播的卡片索引
    let carouselTimer = null; // 輪播計時器

    // 頁面載入完成後發起 fetch 請求
    document.addEventListener('DOMContentLoaded', fetchMessageData);

    /**
     * 發送 fetch 請求讀取 Google 試算表 CSV 資料
     */
    async function fetchMessageData() {
      const loadingScreen = document.getElementById('loading-screen');
      const masonryContainer = document.getElementById('masonry-container');

      try {
        const response = await fetch(GOOGLE_SHEET_CSV_URL);
        if (!response.ok) throw new Error('無法順利讀取 CSV 資料');
        
        const csvText = await response.text();
        const parsedRows = parseCSV(csvText);

        // 移除表頭（第 0 列：時間戳記, 你的名字/暱稱, 你想對我說的話）與無效列
        const dataRows = parsedRows.slice(1).filter(row => row.length >= 2 && row[1].trim() !== '');

        // 隱藏「讀取留言中…」動畫，顯示瀑布流網格
        loadingScreen.style.display = 'none';
        masonryContainer.style.display = 'block';

        if (dataRows.length === 0) {
          masonryContainer.innerHTML = '<p style="text-align:center; color:#718096; width:100%;">目前試算表中還沒有留言喔！</p>';
          return;
        }

        // 1. 動態生成卡片
        renderCards(dataRows);

        // 2. 啟動 3 秒輪播 Highlight 特效
        startCarousel();

      } catch (error) {
        console.warn('線上 CSV 抓取失敗，載入備援測試資料：', error);
        
        // 備援預設資料 (確保在本地端或網路受限時依然能完美呈現)
        const fallbackData = [
          ['2026/10/19 14:30', 'Emma', 'Jill 祝你天天開心！期待下次一起去喝咖啡聚聚 ☕✨'],
          ['2026/10/19 15:10', 'Alex', '你的網頁作品真的做得太讚了！繼續加油！🚀'],
          ['2026/10/19 16:00', '心怡', '看到你一直這麼努力，真的備受感應！要記得多休息喔 ❤️'],
          ['2026/10/19 17:25', 'Jason', 'Happy Birthday in advance! 祝你新的一年所有願望都實現 🎂'],
          ['2026/10/19 18:40', '小明', '有空再一起出來拍照拍片！好久沒聚了～']
        ];

        loadingScreen.style.display = 'none';
        masonryContainer.style.display = 'block';
        renderCards(fallbackData);
        startCarousel();
      }
    }

    /**
     * 專用 CSV 解析器：可正確處理留言內容中含有逗號 (,) 或換行符號的情況
     */
    function parseCSV(text) {
      const lines = [];
      let row = [];
      let inQuotes = false;
      let currentVal = '';

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1] || '';

        if (char === '"') {
          if (inQuotes && nextChar === '"') {
            currentVal += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === ',' && !inQuotes) {
          row.push(currentVal.trim());
          currentVal = '';
        } else if ((char === '\r' || char === '\n') && !inQuotes) {
          if (char === '\r' && nextChar === '\n') i++;
          row.push(currentVal.trim());
          if (row.some(cell => cell.length > 0)) lines.push(row);
          row = [];
          currentVal = '';
        } else {
          currentVal += char;
        }
      }

      if (currentVal || row.length > 0) {
        row.push(currentVal.trim());
        if (row.some(cell => cell.length > 0)) lines.push(row);
      }

      return lines;
    }

    /**
     * 動態生成卡片 DOM 並呈現於畫面上
     */
    function renderCards(rows) {
      const masonryContainer = document.getElementById('masonry-container');
      masonryContainer.innerHTML = '';
      messageCards = [];

      rows.forEach((row) => {
        // CSV 欄位順序預設：[0] 時間戳記, [1] 名字/暱稱, [2] 想對我說的話
        const timestamp = row[0] || '';
        const name = row[1] || '匿名朋友';
        const message = row[2] || '';

        const card = document.createElement('div');
        card.className = 'message-card';

        card.innerHTML = `
          <div class="card-header">
            <span class="author-name"><i class="fa-solid fa-heart"></i> ${escapeHTML(name)}</span>
            <span class="timestamp">${escapeHTML(timestamp)}</span>
          </div>
          <div class="card-body">${escapeHTML(message)}</div>
          <div class="card-footer"><i class="fa-solid fa-sparkles"></i></div>
        `;

        masonryContainer.appendChild(card);
        messageCards.push(card);
      });
    }

    /**
     * 啟動隨時間輪播 Highlight 特效
     */
    function startCarousel() {
      if (messageCards.length === 0) return;

      // 預設第 0 張卡片亮起
      highlightCard(currentIndex);

      // 設定 setInterval 計時器，每隔指定毫秒數輪播下一張
      carouselTimer = setInterval(() => {
        currentIndex = (currentIndex + 1) % messageCards.length;
        highlightCard(currentIndex);
      }, CAROUSEL_INTERVAL_MS);
    }

    /**
     * 切換指定索引卡片的亮起狀態
     */
    function highlightCard(index) {
      messageCards.forEach((card, i) => {
        if (i === index) {
          card.classList.add('highlight');
          // 自動滾動平滑保持當前亮起的卡片於視野中央/附近
          card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        } else {
          card.classList.remove('highlight');
        }
      });
    }

    /**
     * 轉義 HTML 避免 XSS 安全問題
     */
    function escapeHTML(str) {
      return String(str).replace(/[&<>'"]/g, 
        tag => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          "'": '&#39;',
          '"': '&quot;'
        }[tag] || tag)
      );
    }
  </script>
</body>
</html>
