<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>朋友對我的動態留言板 - 原神風格</title>
  
  <!-- 導入 Google 歐風經典字體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       【可修改顏色與全域變數區】
       ========================================================================== */
    :root {
      /* 原神經典金黃與高貴配色 */
      --primary-gold: #e6c88b;       /* 標題與強調金 */
      --gold-border: #c3a163;        /* 邊框金 */
      --bright-highlight: #ffe396;    /* 亮起發光金 */
      
      /* 深色底色（提瓦特夜空質感） */
      --bg-dark: #0d121d;             /* 主背景深藍 */
      --bg-card: rgba(22, 29, 44, 0.85); /* 卡片半透明背景 */
      --card-border: rgba(195, 161, 99, 0.3); /* 卡片預設邊框 */

      /* 文字顏色 */
      --text-main: #ece5d8;          /* 內文乳白 */
      --text-sub: #a3b0c2;           /* 名字/副標次要字體色 */
      
      /* 動畫控制時間 */
      --transition-speed: 0.6s;      /* 卡片切換輪播特效時的平滑時間 */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      /* 紋理背景與星空漸層 */
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(30, 45, 71, 0.6) 0%, transparent 70%),
        radial-gradient(circle at 80% 80%, rgba(195, 161, 99, 0.05) 0%, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      font-family: 'Noto Serif TC', 'Cinzel', serif;
      min-height: 100vh;
      padding: 40px 20px;
    }

    /* ==========================================================================
       【頁頭標題設計】
       ========================================================================== */
    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-family: 'Cinzel', 'Noto Serif TC', serif;
      font-size: 2.5rem;
      color: var(--primary-gold);
      text-shadow: 0 0 10px rgba(230, 200, 139, 0.3), 0 2px 4px rgba(0,0,0,0.8);
      letter-spacing: 2px;
      position: relative;
      display: inline-block;
      padding: 0 20px;
    }

    /* 標題左右的菱形裝飾 */
    header h1::before, header h1::after {
      content: '◆';
      font-size: 1.2rem;
      color: var(--gold-border);
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
    }
    header h1::before { left: -10px; }
    header h1::after { right: -10px; }

    header p {
      color: var(--text-sub);
      margin-top: 10px;
      font-size: 1rem;
      letter-spacing: 1px;
    }

    /* ==========================================================================
       【酷炫載入中動畫（原石造型與發光）】
       ========================================================================== */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 100px;
    }

    /* 原石形狀繪製與旋轉 */
    .primogem-spinner {
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg, #e6c88b 0%, #89cff0 50%, #9370db 100%);
      clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
      animation: spinAndGlow 2s infinite linear;
      box-shadow: 0 0 20px rgba(230, 200, 139, 0.8);
    }

    @keyframes spinAndGlow {
      0% { transform: rotate(0deg) scale(1); filter: hue-rotate(0deg); }
      50% { transform: rotate(180deg) scale(1.2); filter: hue-rotate(180deg); }
      100% { transform: rotate(360deg) scale(1); filter: hue-rotate(360deg); }
    }

    #loading p {
      margin-top: 20px;
      color: var(--primary-gold);
      font-size: 1.2rem;
      letter-spacing: 2px;
    }

    /* ==========================================================================
       【瀑布流版型 Masonry Layout】
       ========================================================================== */
    .masonry-container {
      /* 使用 CSS Column 實現天然瀑布流 */
      column-count: 3;             /* 預設大螢幕顯示 3 欄 */
      column-gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
      opacity: 0;
      transition: opacity 1s ease;
    }

    /* 響應式調整欄數 */
    @media (max-width: 900px) {
      .masonry-container { column-count: 2; }
    }
    @media (max-width: 600px) {
      .masonry-container { column-count: 1; }
    }

    /* ==========================================================================
       【原神風格留言卡片基礎樣式】
       ========================================================================== */
    .card {
      break-inside: avoid;        /* 防止卡片從中間被斷開 */
      margin-bottom: 20px;
      background: var(--bg-card);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 20px;
      position: relative;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      
      /* 設定過渡動畫，讓輪播亮起時無縫變化 */
      transition: 
        transform var(--transition-speed) ease,
        box-shadow var(--transition-speed) ease,
        border-color var(--transition-speed) ease,
        opacity var(--transition-speed) ease,
        filter var(--transition-speed) ease;

      /* 四角經典原神菱形切角裝飾感 */
      backdrop-filter: blur(5px);
    }

    /* 卡片四角的金屬圓點裝飾 */
    .card::before {
      content: '';
      position: absolute;
      top: 6px;
      left: 6px;
      width: 4px;
      height: 4px;
      background: var(--gold-border);
      border-radius: 50%;
      box-shadow: 0 0 4px var(--primary-gold);
    }

    .card-header {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px solid rgba(195, 161, 99, 0.2);
      padding-bottom: 8px;
    }

    /* 風格化頭像（以原神派蒙風格星號做前綴） */
    .card-avatar {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #c3a163, #e6c88b);
      clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
      margin-right: 10px;
      flex-shrink: 0;
    }

    .card-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary-gold);
      letter-spacing: 1px;
    }

    .card-content {
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--text-main);
      word-break: break-word;
      white-space: pre-wrap; /* 保持留言中的換行 */
    }

    /* ==========================================================================
       【輪播 Highlight 焦點特效（重點需求）】
       ========================================================================== */

    /* 1. 當前被選中的卡片：放大亮起 */
    .card.highlight {
      transform: scale(1.06);              /* 放大卡片 */
      border-color: var(--bright-highlight); /* 明亮金黃邊框 */
      box-shadow: 
        0 0 25px rgba(255, 227, 150, 0.6),  /* 外圍耀眼金光 */
        inset 0 0 10px rgba(255, 227, 150, 0.2);
      opacity: 1;                          /* 完全不透明 */
      filter: blur(0px);                   /* 清晰顯示 */
      z-index: 10;                         /* 壓在其他卡片上方 */
    }

    /* 2. 未被選中的卡片：微暗、模糊、營造展覽焦點感 */
    .masonry-container.has-highlight .card:not(.highlight) {
      opacity: 0.35;                       /* 降低透明度 */
      filter: blur(1.5px);                  /* 輕微模糊背景 */
      transform: scale(0.97);              /* 稍微縮小 */
    }
  </style>
</head>
<body>

  <!-- 頁頭標題 -->
  <header>
    <h1>旅行者留言板</h1>
    <p>—— 來自提瓦特大陸好友的真心話 ——</p>
  </header>

  <!-- 讀取中動畫（動畫載入區） -->
  <div id="loading">
    <div class="primogem-spinner"></div>
    <p>讀取留言中…</p>
  </div>

  <!-- 留言卡片瀑布流容器 -->
  <div class="masonry-container" id="board"></div>

  <script>
    /* ==========================================================================
       【控制參數設定區（方便修改）】
       ========================================================================== */
    // Google 試算表 CSV 網址
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQJsD1qv1LHbS5JaDSB4TUGKWGABGfJ_ASTzOpAE6TO2ysJ34e47sWGizGZJoDIFVZEQZj03cwjbahb/pub?output=csv";

    // 輪播計時器間隔時間 (毫秒) -> 3000ms = 3秒
    const ROTATE_INTERVAL_MS = 3000; 

    /* ==========================================================================
       【CSV 解析邏輯 (含雙引號與逗號處置)】
       ========================================================================== */
    function parseCSV(text) {
      const lines = text.split('\n');
      const result = [];

      for (let i = 1; i < lines.length; i++) { // 跳過標題列 i=0
        const line = lines[i].trim();
        if (!line) continue;

        // 正則表達式：正確處理以雙引號包裹且內含逗號的欄位
        const pattern = /(?:\"([^\"]*(?:\"\"[^\"]*)*)\"|([^,\"]*))(?:,|$)/g;
        const row = [];
        let match;

        while ((match = pattern.exec(line)) && row.length < 3) {
          let val = match[1] !== undefined ? match[1].replace(/\"\"/g, '"') : match[2];
          row.push(val ? val.trim() : '');
          if (pattern.lastIndex === line.length) break;
        }

        // CSV 欄位順序預設：[0]時間戳記, [1]名字, [2]留言內容
        if (row.length >= 2) {
          result.push({
            name: row[1] || '匿名旅行者',
            message: row[2] || '（這名旅行者什麼都沒留下）'
          });
        }
      }
      return result;
    }

    /* ==========================================================================
       【繪製卡片 DOM 生成】
       ========================================================================== */
    function renderBoard(data) {
      const board = document.getElementById('board');
      const loading = document.getElementById('loading');

      if (data.length === 0) {
        loading.innerHTML = "<p>目前還沒有任何留言喔！</p>";
        return;
      }

      // 產生卡片 HTML
      data.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-header">
            <div class="card-avatar"></div>
            <div class="card-name">${escapeHTML(item.name)}</div>
          </div>
          <div class="card-content">${escapeHTML(item.message)}</div>
        `;
        board.appendChild(card);
      });

      // 隱藏載入中動畫，顯示留言板
      loading.style.display = 'none';
      board.style.opacity = '1';

      // 啟動 3 秒輪播 Highlight 特效
      startCardHighlightCycle();
    }

    // 防範 XSS 攻擊的文字轉譯函式
    function escapeHTML(str) {
      return str.replace(/[&<>"']/g, match => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[match]));
    }

    /* ==========================================================================
       【隨時間輪播 Highlight 特效控制 (setInterval)】
       ========================================================================== */
    let currentIndex = 0;

    function startCardHighlightCycle() {
      const cards = document.querySelectorAll('.card');
      const container = document.getElementById('board');

      if (cards.length === 0) return;

      // 啟動容器的「背景微暗模式」樣式類別
      container.classList.add('has-highlight');

      // 立即觸發第一次亮起
      highlightNextCard(cards);

      // 設定每隔 3 秒輪播下一張卡片
      setInterval(() => {
        highlightNextCard(cards);
      }, ROTATE_INTERVAL_MS);
    }

    function highlightNextCard(cards) {
      // 1. 移除先前所有卡片的亮起效果
      cards.forEach(card => card.classList.remove('highlight'));

      // 2. 幫當前輪到的卡片加上亮起效果
      const currentCard = cards[currentIndex];
      currentCard.classList.add('highlight');

      // 3. 遞增索引，若超過總數則循環回第 0 張
      currentIndex = (currentIndex + 1) % cards.length;
    }

    /* ==========================================================================
       【主程式執行 (Fetch 資料請領)】
       ========================================================================== */
    fetch(CSV_URL)
      .then(response => {
        if (!response.ok) throw new Error("網路連線失敗");
        return response.text();
      })
      .then(csvText => {
        const parsedData = parseCSV(csvText);
        renderBoard(parsedData);
      })
      .catch(error => {
        console.error("載入 CSV 失敗:", error);
        document.getElementById('loading').innerHTML = `
          <p style="color: #ff6b6b;">無法載入留言，請確認網路連線或試算表權限。</p>
        `;
      });
  </script>
</body>
</html>
